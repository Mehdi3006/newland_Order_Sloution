<!DOCTYPE html>
<html lang="fa" dir="rtl" class="bg-gray-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پیگیری سفارشات نیولند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'Tahoma', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* The body font is now handled by the Tailwind config above to ensure correct priority */
      
      /* Simple scrollbar styling for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e5e7eb;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      /* Toast animations */
      @keyframes shrink-width {
        from { width: 100%; }
        to { width: 0%; }
      }
      .progress-bar-animate {
        animation: shrink-width 5s linear forwards;
      }
      @keyframes toast-in-right {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes toast-out-right {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
      @keyframes toast-in-left {
        from { transform: translateX(-100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes toast-out-left {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
      .animate-toast-in {
        animation: toast-in-right 0.3s ease-out forwards;
      }
      .animate-toast-out {
        animation: toast-out-right 0.3s ease-in forwards;
      }
      [dir="rtl"] .animate-toast-in {
        animation: toast-in-left 0.3s ease-out forwards;
      }
      [dir="rtl"] .animate-toast-out {
        animation: toast-out-left 0.3s ease-in forwards;
      }
      /* Kanban card drop animation */
      @keyframes drop-in {
        from {
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
      }
      .animate-drop-in {
        animation: drop-in 0.4s ease-out;
      }
    </style>
<link rel="stylesheet" href="./index.css">
